name: Launcher CI Release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: launcher

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.channel.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          # Publish only from semver tags:
          #   v0.3.14          -> release / 0.3.14
          #   v0.3.14-beta.1   -> beta    / 0.3.14-beta.1
          channel=""
          should_publish="false"

          # Publish exclusively from version tags (branch pushes only build).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Invalid version tag: ${GITHUB_REF_NAME} (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
              exit 1
            fi
            if [[ "$version_name" == *-* ]]; then
              channel="beta"
            else
              channel="release"
            fi
            should_publish="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_publish="false"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Capture release metadata
        id: meta
        shell: bash
        run: |
          commit_hash="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          short_sha="${commit_hash:0:8}"
          should_publish="${{ steps.channel.outputs.should_publish }}"

          if [ "$should_publish" = "true" ]; then
            version_name="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            base_version="$(python - <<'PY'
          import json
          with open("tauri-app/package.json", "r", encoding="utf-8") as f:
              print(json.load(f)["version"].strip())
          PY
          )"
            version_name="${base_version}-ci.${GITHUB_RUN_NUMBER}+${short_sha}"
            release_tag="launcher-${version_name}"
          fi

          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          changelog="$(git log -1 --pretty=format:'%s%n%n%b')"
          {
            echo "changelog<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Launcher version: $version_name (publish=$should_publish)"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            build_script: build:installer:windows
            artifact_glob: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          - target: windows-x86_64-win7
            os: windows-latest
            build_script: build:installer:windows:win7
            artifact_glob: tauri-app/src-tauri/target/x86_64-win7-windows-msvc/release/bundle/nsis/*.exe
            needs_fixed_runtime: true
          - target: linux-x86_64
            os: ubuntu-22.04
            build_script: build:installer:linux
            artifact_glob: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          - target: macos-aarch64
            os: macos-14
            build_script: build:installer:macos
            artifact_glob: tauri-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Rust
        if: matrix.target != 'windows-x86_64-win7'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust for Windows 7
        if: matrix.target == 'windows-x86_64-win7'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src

      - name: Add macOS Rust target
        if: matrix.target == 'macos-aarch64'
        run: rustup target add aarch64-apple-darwin

      - name: Configure Windows 7 Rust target
        if: matrix.target == 'windows-x86_64-win7'
        working-directory: tauri-app/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".cargo" | Out-Null
          @'
          [build]
          target = "x86_64-win7-windows-msvc"

          [unstable]
          build-std = ["std"]

          [target.x86_64-win7-windows-msvc]
          rustflags = ["-C", "target-feature=+crt-static"]
          '@ | Set-Content -Encoding utf8 ".cargo/config.toml"

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-app/src-tauri -> target
          # matrix.os keeps caches isolated per runner image: an ubuntu-latest
          # (glibc 2.39) cache once poisoned ubuntu-22.04 builds with build
          # scripts that abort with "GLIBC_2.39 not found".
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Typecheck frontend
        working-directory: tauri-app
        run: npm run typecheck

      - name: Lint frontend
        if: runner.os == 'Linux'
        working-directory: tauri-app
        run: npm run lint -- --max-warnings 73

      - name: Test Rust backend
        if: runner.os == 'Linux'
        working-directory: tauri-app/src-tauri
        run: cargo test

      - name: Verify Windows 7 packaging files
        if: runner.os == 'Linux'
        run: python3 tauri-app/src-tauri/scripts/verify-win7-pe.py --self-test --check-packaging .

      - name: Configure ad-hoc signing for macOS builds
        if: matrix.target == 'macos-aarch64'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Download WebView2 fixed runtime (Windows 7 build)
        if: matrix.needs_fixed_runtime
        working-directory: tauri-app/src-tauri
        shell: pwsh
        run: |
          # Last WebView2 runtime supporting Windows 7 SP1 (109.0.1518.78), mirrored on GitHub.
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab" -OutFile "wv2.cab"
          expand "wv2.cab" -F:* "."
          Remove-Item "wv2.cab"
          if (-not (Test-Path ".\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64\EBWebView\x64\EmbeddedBrowserWebView.dll")) {
            throw "Fixed WebView2 runtime was not extracted correctly"
          }

      - name: Prepare Windows 7 VC++ and Universal CRT payload
        if: matrix.target == 'windows-x86_64-win7'
        working-directory: tauri-app/src-tauri
        shell: pwsh
        run: powershell -File scripts/prepare-win7-runtime.ps1

      - name: Build installer
        if: matrix.target != 'windows-x86_64-win7'
        working-directory: tauri-app
        run: npm run ${{ matrix.build_script }}

      - name: Build Windows 7 installer
        if: matrix.target == 'windows-x86_64-win7'
        working-directory: tauri-app
        env:
          STATIC_VCRUNTIME: "false"
        run: npm run ${{ matrix.build_script }}

      - name: Verify Linux glibc baseline
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          binary = "tauri-app/src-tauri/target/release/fpsmaster-launcher"
          versions = [
              tuple(map(int, value.split(b".")))
              for value in re.findall(
                  rb"GLIBC_([0-9]+\.[0-9]+)",
                  subprocess.check_output(["readelf", "--version-info", binary]),
              )
          ]
          maximum = max(versions, default=(0, 0))
          print(f"Maximum required glibc: {maximum[0]}.{maximum[1]}")
          if maximum > (2, 35):
              raise SystemExit("Linux artifact exceeds the Ubuntu 22.04 glibc 2.35 baseline")
          PY

      - name: Verify Windows 7 binary imports
        if: matrix.target == 'windows-x86_64-win7'
        shell: pwsh
        run: |
          $binary = "tauri-app/src-tauri/target/x86_64-win7-windows-msvc/release/fpsmaster-launcher.exe"
          $installers = @(Get-ChildItem -Path "tauri-app/src-tauri/target/x86_64-win7-windows-msvc/release/bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending)
          if (-not $installers) {
            throw "Windows 7 NSIS installer was not produced"
          }
          python tauri-app/src-tauri/scripts/verify-win7-pe.py --binary $binary --installer $installers[0].FullName --check-packaging .
          $runtimeDir = "tauri-app/src-tauri/win7-runtime"
          foreach ($name in @("ucrtbase.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "api-ms-win-crt-runtime-l1-1-0.dll", "vc_redist.x64.exe")) {
            if (-not (Test-Path (Join-Path $runtimeDir $name))) {
              throw "Windows 7 runtime payload is missing $name"
            }
          }

      - name: Verify macOS binary has no build-machine dylib references
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          dmg="$(ls tauri-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)"
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" > /dev/null 2>&1 || true; rmdir "$mount_point" 2>/dev/null || true' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
          app_bundle="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          binary="$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          echo "Checking $binary"
          deps="$(otool -L "$binary")"
          printf '%s\n' "$deps"
          # Without this the check silently "passes" whenever otool produced nothing.
          if ! printf '%s\n' "$deps" | grep -q '/usr/lib/libSystem'; then
            echo "::error::otool produced no usable output; the dylib check did not actually run."
            exit 1
          fi
          if printf '%s\n' "$deps" | grep -E '/opt/homebrew|/usr/local/(opt|lib)/'; then
            echo "::error::Binary links against a build-machine library. Users without it crash at launch with dyld 'Library missing'."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          sign_info="$(codesign --display --verbose=4 "$app_bundle" 2>&1 || true)"
          printf '%s\n' "$sign_info"

      - name: Capture artifact metadata
        shell: bash
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          matches = sorted(
              glob.glob(os.environ["ARTIFACT_GLOB"]),
              key=lambda path: os.path.getmtime(path),
              reverse=True,
          )
          if not matches:
              raise SystemExit(f"Installer was not produced: {os.environ['ARTIFACT_GLOB']}")

          artifact = Path(matches[0])
          payload = {
              "target": os.environ["TARGET"],
              "assetName": artifact.name,
              "checksum": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "fileSize": artifact.stat().st_size,
          }
          output_dir = Path("build-meta")
          output_dir.mkdir(exist_ok=True)
          metadata_path = output_dir / f"{os.environ['TARGET']}.json"
          metadata_path.write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          release_dir = Path("release-dist")
          release_dir.mkdir(exist_ok=True)
          shutil.copy2(artifact, release_dir / artifact.name)
          shutil.copy2(metadata_path, release_dir / metadata_path.name)
          PY

      - name: Cache release artifacts
        if: needs.resolve.outputs.should_publish == 'true'
        uses: actions/cache@v4
        with:
          path: release-dist
          key: launcher-build-${{ github.run_id }}-${{ matrix.target }}
          enableCrossOsArchive: true

  publish:
    needs:
      - resolve
      - build
    if: github.event_name != 'pull_request' && needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Restore Windows artifacts
        uses: actions/cache/restore@v4
        with:
          path: release-dist
          key: launcher-build-${{ github.run_id }}-windows-x86_64
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Windows 7 artifacts
        uses: actions/cache/restore@v4
        with:
          path: release-dist
          key: launcher-build-${{ github.run_id }}-windows-x86_64-win7
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore Linux artifacts
        uses: actions/cache/restore@v4
        with:
          path: release-dist
          key: launcher-build-${{ github.run_id }}-linux-x86_64
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Restore macOS artifacts
        uses: actions/cache/restore@v4
        with:
          path: release-dist
          key: launcher-build-${{ github.run_id }}-macos-aarch64
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Collect release files
        shell: bash
        run: |
          find release-dist -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Launcher ${{ needs.resolve.outputs.version_name }}
          body: ${{ needs.resolve.outputs.changelog }}
          files: |
            release-dist/*.exe
            release-dist/*.deb
            release-dist/*.dmg
          fail_on_unmatched_files: true

      - name: Upload to Qiniu OSS and notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_S3_ENDPOINT: ${{ secrets.QINIU_S3_ENDPOINT }}
          QINIU_S3_REGION: ${{ secrets.QINIU_S3_REGION }}
          QINIU_CDN_BASE_URL: ${{ secrets.QINIU_CDN_BASE_URL }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi
          if [ -z "$QINIU_ACCESS_KEY" ] || [ -z "$QINIU_SECRET_KEY" ] || [ -z "$QINIU_BUCKET" ] || [ -z "$QINIU_S3_ENDPOINT" ] || [ -z "$QINIU_CDN_BASE_URL" ]; then
            echo "Qiniu OSS secrets are not configured" >&2
            exit 1
          fi

          python3 -m pip install --quiet --user boto3

          shopt -s nullglob
          metadata_files=(release-dist/*.json)
          if [ "${#metadata_files[@]}" -eq 0 ]; then
            echo "No launcher metadata found in dist" >&2
            exit 1
          fi

          for metadata_path in "${metadata_files[@]}"; do
            asset_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["assetName"])' "$metadata_path")"
            target="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target"])' "$metadata_path")"
            checksum="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksum"])' "$metadata_path")"
            file_size="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["fileSize"])' "$metadata_path")"
            artifact_path="release-dist/$asset_name"
            if [ ! -f "$artifact_path" ]; then
              echo "Artifact listed by metadata was not found: $artifact_path" >&2
              exit 1
            fi

            object_key="launcher/${CHANNEL}/${VERSION_NAME}/${COMMIT_HASH}/${target}/${asset_name}"
            export ARTIFACT_PATH="$artifact_path" OBJECT_KEY="$object_key"
            download_url="$(python3 -c "import os,boto3; e=os.environ['QINIU_S3_ENDPOINT'].rstrip('/'); c=os.environ['QINIU_CDN_BASE_URL'].rstrip('/'); b=os.environ['QINIU_BUCKET']; k=os.environ['OBJECT_KEY']; p=os.environ['ARTIFACT_PATH']; client=boto3.client('s3', endpoint_url=e, aws_access_key_id=os.environ['QINIU_ACCESS_KEY'], aws_secret_access_key=os.environ['QINIU_SECRET_KEY'], region_name=os.environ.get('QINIU_S3_REGION') or 'ap-southeast-1'); client.upload_file(p,b,k); print(f'{c}/{k}')")"
            echo "Uploaded ${asset_name} -> ${download_url}"

            export TARGET="$target" CHECKSUM="$checksum" FILE_SIZE="$file_size" DOWNLOAD_URL="$download_url"
            python3 -c 'import json, os; payload = dict(productCode=os.environ["PRODUCT_CODE"], channelCode=os.environ["CHANNEL"], versionName=os.environ["VERSION_NAME"], commitHash=os.environ["COMMIT_HASH"], artifactSourceType="external_url", downloadUrl=os.environ["DOWNLOAD_URL"], fileSize=int(os.environ["FILE_SIZE"]), checksum=os.environ["CHECKSUM"], recommended=True, mandatory=True, target=os.environ["TARGET"], changelog=os.environ["CHANGELOG"]); open("payload.json", "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False))'

            curl --fail-with-body --show-error --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              --data @payload.json \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
          done
