name: Launcher CI Release

on:
  pull_request:
  push:
    branches:
      - master
      - nightly
      - nightly/**
      - cannary
      - cannary/**
      - beta
      - beta/**
      - release
      - release/**
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: launcher

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.channel.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          channel=""
          should_publish="false"

          case "$ref" in
            master|beta|beta/*)
              channel="beta"
              should_publish="true"
              ;;
            nightly|nightly/*)
              channel="nightly"
              should_publish="true"
              ;;
            cannary|cannary/*)
              channel="cannary"
              should_publish="true"
              ;;
            release|release/*)
              channel="release"
              should_publish="true"
              ;;
          esac

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Capture release metadata
        id: meta
        shell: bash
        run: |
          base_version="$(python - <<'PY'
          import json
          with open("tauri-app/package.json", "r", encoding="utf-8") as f:
              print(json.load(f)["version"].strip())
          PY
          )"
          commit_hash="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          short_sha="${commit_hash:0:8}"
          channel="${{ steps.channel.outputs.channel }}"
          if [ "$channel" = "release" ]; then
            version_name="$base_version"
          else
            version_name="$base_version-$channel.$GITHUB_RUN_NUMBER+$short_sha"
          fi
          release_tag="launcher-$channel-$GITHUB_RUN_NUMBER-$short_sha"

          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          changelog="$(git log -1 --pretty=format:'%s%n%n%b')"
          {
            echo "changelog<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            build_script: build:installer:windows
            artifact_glob: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          - target: linux-x86_64
            os: ubuntu-latest
            build_script: build:installer:linux
            artifact_glob: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          - target: macos-aarch64
            os: macos-14
            build_script: build:installer:macos
            artifact_glob: tauri-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: matrix.target == 'macos-aarch64'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build installer
        working-directory: tauri-app
        run: npm run ${{ matrix.build_script }}

      - name: Capture artifact metadata
        shell: bash
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path

          matches = sorted(
              glob.glob(os.environ["ARTIFACT_GLOB"]),
              key=lambda path: os.path.getmtime(path),
              reverse=True,
          )
          if not matches:
              raise SystemExit(f"Installer was not produced: {os.environ['ARTIFACT_GLOB']}")

          artifact = Path(matches[0])
          payload = {
              "target": os.environ["TARGET"],
              "assetName": artifact.name,
              "checksum": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "fileSize": artifact.stat().st_size,
          }
          output_dir = Path("build-meta")
          output_dir.mkdir(exist_ok=True)
          (output_dir / f"{os.environ['TARGET']}.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_glob }}
            build-meta/${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    needs:
      - resolve
      - build
    if: github.event_name != 'pull_request' && needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-build-*
          path: dist
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-dist
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.json' \) \
            -exec cp '{}' release-dist/ \;
          find release-dist -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Launcher ${{ needs.resolve.outputs.version_name }}
          body: ${{ needs.resolve.outputs.changelog }}
          files: |
            release-dist/*.exe
            release-dist/*.deb
            release-dist/*.dmg
          fail_on_unmatched_files: true

      - name: Notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi

          shopt -s nullglob
          metadata_files=(release-dist/*.json)
          if [ "${#metadata_files[@]}" -eq 0 ]; then
            echo "No launcher metadata found in dist" >&2
            exit 1
          fi

          for metadata_path in "${metadata_files[@]}"; do
            asset_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["assetName"])' "$metadata_path")"
            target="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target"])' "$metadata_path")"
            checksum="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksum"])' "$metadata_path")"
            file_size="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["fileSize"])' "$metadata_path")"
            artifact_path="release-dist/$asset_name"
            if [ ! -f "$artifact_path" ]; then
              echo "Artifact listed by metadata was not found: $artifact_path" >&2
              exit 1
            fi

            upload_response="$(curl --fail --show-error --silent \
              -X POST \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              -F "file=@${artifact_path}" \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/upload")"

            export UPLOAD_RESPONSE="$upload_response"
            export TARGET="$target"
            export CHECKSUM="$checksum"
            export FILE_SIZE="$file_size"
            python - <<'PY'
            import json
            import os

            upload = json.loads(os.environ["UPLOAD_RESPONSE"])["data"]
            payload = {
                "productCode": os.environ["PRODUCT_CODE"],
                "channelCode": os.environ["CHANNEL"],
                "versionName": os.environ["VERSION_NAME"],
                "commitHash": os.environ["COMMIT_HASH"],
                "artifactSourceType": "UPLOADED_FILE",
                "downloadUrl": upload["url"],
                "fileBucket": upload.get("bucket") or "",
                "fileKey": upload.get("key") or "",
                "fileSize": int(os.environ["FILE_SIZE"]),
                "checksum": os.environ["CHECKSUM"],
                "recommended": True,
                "mandatory": True,
                "target": os.environ["TARGET"],
                "changelog": os.environ["CHANGELOG"],
            }
            with open("payload.json", "w", encoding="utf-8") as f:
                json.dump(payload, f, ensure_ascii=False)
            PY

            curl --fail --show-error --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              --data @payload.json \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
          done
