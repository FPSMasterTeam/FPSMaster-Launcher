name: Launcher CI Release

on:
  pull_request:
  push:
    branches:
      - master
      - nightly
      - nightly/**
      - cannary
      - cannary/**
      - beta
      - beta/**
      - release
      - release/**
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: launcher
  TARGET: windows-x86_64
  ARTIFACT_SOURCE_TYPE: external_url

jobs:
  build:
    runs-on: windows-latest
    outputs:
      should_publish: ${{ steps.channel.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      asset_name: ${{ steps.meta.outputs.asset_name }}
      download_url: ${{ steps.meta.outputs.download_url }}
      checksum: ${{ steps.meta.outputs.checksum }}
      file_size: ${{ steps.meta.outputs.file_size }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        run: |
          $ref = "${env:GITHUB_REF_NAME}"
          $channel = ""
          $shouldPublish = "false"

          switch -Wildcard ($ref) {
            "master" {
              $channel = "beta"
              $shouldPublish = "true"
            }
            "nightly" {
              $channel = "nightly"
              $shouldPublish = "true"
            }
            "nightly/*" {
              $channel = "nightly"
              $shouldPublish = "true"
            }
            "cannary" {
              $channel = "cannary"
              $shouldPublish = "true"
            }
            "cannary/*" {
              $channel = "cannary"
              $shouldPublish = "true"
            }
            "beta" {
              $channel = "beta"
              $shouldPublish = "true"
            }
            "beta/*" {
              $channel = "beta"
              $shouldPublish = "true"
            }
            "release" {
              $channel = "release"
              $shouldPublish = "true"
            }
            "release/*" {
              $channel = "release"
              $shouldPublish = "true"
            }
          }

          "channel=$channel" >> $env:GITHUB_OUTPUT
          "should_publish=$shouldPublish" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build NSIS installer
        working-directory: tauri-app
        run: npm run build:installer

      - name: Capture artifact metadata
        id: meta
        run: |
          $installer = Get-ChildItem -Path "tauri-app/src-tauri/target/release/bundle/nsis/*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $package = Get-Content "tauri-app/package.json" | ConvertFrom-Json
          $baseVersion = $package.version.Trim()
          $commitHash = $env:GITHUB_SHA.ToLowerInvariant()
          $shortSha = $commitHash.Substring(0, 8)
          $channel = "${{ steps.channel.outputs.channel }}"
          $versionName = if ($channel -eq "release") {
            $baseVersion
          } else {
            "$baseVersion-$channel.$env:GITHUB_RUN_NUMBER+$shortSha"
          }
          $releaseTag = "launcher-$channel-$env:GITHUB_RUN_NUMBER-$shortSha"
          $checksum = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileSize = $installer.Length

          "asset_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "commit_hash=$commitHash" >> $env:GITHUB_OUTPUT
          "version_name=$versionName" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "file_size=$fileSize" >> $env:GITHUB_OUTPUT
          "download_url=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$releaseTag/$($installer.Name)" >> $env:GITHUB_OUTPUT

          $changelog = git log -1 --pretty=format:'%s%n%n%b'
          @"
          changelog<<EOF
          $changelog
          EOF
          "@ >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-build
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Launcher ${{ needs.build.outputs.version_name }}
          body: ${{ needs.build.outputs.changelog }}
          files: dist/*.exe
          fail_on_unmatched_files: true

      - name: Notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi

          changelog_json="$(printf '%s' '${{ needs.build.outputs.changelog }}' | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"

          cat <<EOF > payload.json
          {
            "productCode": "${PRODUCT_CODE}",
            "channelCode": "${{ needs.build.outputs.channel }}",
            "versionName": "${{ needs.build.outputs.version_name }}",
            "commitHash": "${{ needs.build.outputs.commit_hash }}",
            "artifactSourceType": "${ARTIFACT_SOURCE_TYPE}",
            "downloadUrl": "${{ needs.build.outputs.download_url }}",
            "fileSize": ${{ needs.build.outputs.file_size }},
            "checksum": "${{ needs.build.outputs.checksum }}",
            "recommended": true,
            "mandatory": false,
            "target": "${TARGET}",
            "changelog": ${changelog_json}
          }
          EOF

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
            --data @payload.json \
            "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
