name: Launcher CI Release

on:
  pull_request:
  push:
    branches:
      - master
      - nightly
      - nightly/**
      - cannary
      - cannary/**
      - beta
      - beta/**
      - release
      - release/**
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_CODE: launcher

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.channel.outputs.should_publish }}
      channel: ${{ steps.channel.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          channel=""
          should_publish="false"

          case "$ref" in
            master|release|release/*|beta|beta/*|nightly|nightly/*|cannary|cannary/*)
              channel="release"
              should_publish="true"
              ;;
          esac

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Capture release metadata
        id: meta
        shell: bash
        run: |
          base_version="$(python - <<'PY'
          import json
          with open("tauri-app/package.json", "r", encoding="utf-8") as f:
              print(json.load(f)["version"].strip())
          PY
          )"
          commit_hash="$(printf '%s' "$GITHUB_SHA" | tr '[:upper:]' '[:lower:]')"
          short_sha="${commit_hash:0:8}"
          channel="${{ steps.channel.outputs.channel }}"
          if [ "$channel" = "release" ]; then
            version_name="$base_version"
          else
            version_name="$base_version-$channel.$GITHUB_RUN_NUMBER+$short_sha"
          fi
          release_tag="launcher-$channel-$GITHUB_RUN_NUMBER-$short_sha"

          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          changelog="$(git log -1 --pretty=format:'%s%n%n%b')"
          {
            echo "changelog<<EOF"
            printf '%s\n' "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            build_script: build:installer:windows
            artifact_glob: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          - target: windows-x86_64-win7
            os: windows-latest
            build_script: build:installer:windows:win7
            artifact_glob: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            needs_fixed_runtime: true
          - target: linux-x86_64
            os: ubuntu-latest
            build_script: build:installer:linux
            artifact_glob: tauri-app/src-tauri/target/release/bundle/deb/*.deb
          - target: macos-aarch64
            os: macos-14
            build_script: build:installer:macos
            artifact_glob: tauri-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: matrix.target == 'macos-aarch64'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Typecheck frontend
        working-directory: tauri-app
        run: npm run typecheck

      - name: Download WebView2 fixed runtime (Windows 7 build)
        if: matrix.needs_fixed_runtime
        working-directory: tauri-app/src-tauri
        shell: pwsh
        run: |
          # Last WebView2 runtime supporting Windows 7 SP1 (109.0.1518.78), mirrored on GitHub.
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab" -OutFile "wv2.cab"
          expand "wv2.cab" -F:* "."
          Remove-Item "wv2.cab"
          if (-not (Test-Path ".\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64\EBWebView\x64\EmbeddedBrowserWebView.dll")) {
            throw "Fixed WebView2 runtime was not extracted correctly"
          }

      - name: Build installer
        working-directory: tauri-app
        run: npm run ${{ matrix.build_script }}

      - name: Verify macOS binary has no build-machine dylib references
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          dmg="$(ls tauri-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)"
          mount_point="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
          binary="$(ls "$mount_point"/*.app/Contents/MacOS/* | head -n 1)"
          echo "Checking $binary"
          deps="$(otool -L "$binary")"
          hdiutil detach "$mount_point" > /dev/null
          printf '%s\n' "$deps"
          # Without this the check silently "passes" whenever otool produced nothing.
          if ! printf '%s\n' "$deps" | grep -q '/usr/lib/libSystem'; then
            echo "::error::otool produced no usable output; the dylib check did not actually run."
            exit 1
          fi
          if printf '%s\n' "$deps" | grep -E '/opt/homebrew|/usr/local/(opt|lib)/'; then
            echo "::error::Binary links against a build-machine library. Users without it crash at launch with dyld 'Library missing'."
            exit 1
          fi

      - name: Capture artifact metadata
        shell: bash
        env:
          ARTIFACT_GLOB: ${{ matrix.artifact_glob }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          from pathlib import Path

          matches = sorted(
              glob.glob(os.environ["ARTIFACT_GLOB"]),
              key=lambda path: os.path.getmtime(path),
              reverse=True,
          )
          if not matches:
              raise SystemExit(f"Installer was not produced: {os.environ['ARTIFACT_GLOB']}")

          artifact = Path(matches[0])
          payload = {
              "target": os.environ["TARGET"],
              "assetName": artifact.name,
              "checksum": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "fileSize": artifact.stat().st_size,
          }
          output_dir = Path("build-meta")
          output_dir.mkdir(exist_ok=True)
          (output_dir / f"{os.environ['TARGET']}.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-${{ matrix.target }}
          path: |
            ${{ matrix.artifact_glob }}
            build-meta/${{ matrix.target }}.json
          if-no-files-found: error

  publish:
    needs:
      - resolve
      - build
    if: github.event_name != 'pull_request' && needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-build-*
          path: dist
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-dist
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.json' \) \
            -exec cp '{}' release-dist/ \;
          find release-dist -maxdepth 1 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Launcher ${{ needs.resolve.outputs.version_name }}
          body: ${{ needs.resolve.outputs.changelog }}
          files: |
            release-dist/*.exe
            release-dist/*.deb
            release-dist/*.dmg
          fail_on_unmatched_files: true

      - name: Notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
          COMMIT_HASH: ${{ needs.resolve.outputs.commit_hash }}
          CHANGELOG: ${{ needs.resolve.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi

          shopt -s nullglob
          metadata_files=(release-dist/*.json)
          if [ "${#metadata_files[@]}" -eq 0 ]; then
            echo "No launcher metadata found in dist" >&2
            exit 1
          fi

          for metadata_path in "${metadata_files[@]}"; do
            asset_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["assetName"])' "$metadata_path")"
            target="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target"])' "$metadata_path")"
            checksum="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["checksum"])' "$metadata_path")"
            file_size="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["fileSize"])' "$metadata_path")"
            artifact_path="release-dist/$asset_name"
            if [ ! -f "$artifact_path" ]; then
              echo "Artifact listed by metadata was not found: $artifact_path" >&2
              exit 1
            fi

            export TARGET="$target"
            export CHECKSUM="$checksum"
            export FILE_SIZE="$file_size"
            if [ "$target" = "windows-x86_64-win7" ]; then
              # The Win7 package (~160MB) exceeds the request body limit of the
              # reverse proxy, so it is uploaded in chunks of 50MB.
              upload_id="$(python -c 'import uuid; print(uuid.uuid4().hex)')"
              chunk_dir="$(mktemp -d)"
              split -b 50M "$artifact_path" "$chunk_dir/chunk-"
              total_chunks="$(find "$chunk_dir" -name 'chunk-*' | wc -l)"
              index=0
              for chunk in "$chunk_dir"/chunk-*; do
                curl --fail-with-body --show-error --silent \
                  -X POST \
                  -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
                  -F "file=@${chunk}" \
                  -F "uploadId=${upload_id}" \
                  -F "chunkIndex=${index}" \
                  "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/upload-chunk" > /dev/null
                index=$((index + 1))
              done
              rm -rf "$chunk_dir"

              export UPLOAD_ID="$upload_id" ASSET_NAME="$asset_name" TOTAL_CHUNKS="$total_chunks"
              python -c 'import json, os; complete = dict(uploadId=os.environ["UPLOAD_ID"], fileName=os.environ["ASSET_NAME"], totalChunks=int(os.environ["TOTAL_CHUNKS"])); open("complete.json", "w", encoding="utf-8").write(json.dumps(complete))'

              upload_response="$(curl --fail-with-body --show-error --silent \
                -X POST \
                -H "Content-Type: application/json" \
                -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
                --data @complete.json \
                "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/upload-complete")"

              export UPLOAD_RESPONSE="$upload_response"
              python -c 'import json, os; upload = json.loads(os.environ["UPLOAD_RESPONSE"])["data"]; payload = dict(productCode=os.environ["PRODUCT_CODE"], channelCode=os.environ["CHANNEL"], versionName=os.environ["VERSION_NAME"], commitHash=os.environ["COMMIT_HASH"], artifactSourceType="UPLOADED_FILE", downloadUrl=upload["url"], fileBucket=upload.get("bucket") or "", fileKey=upload.get("key") or "", fileSize=int(os.environ["FILE_SIZE"]), checksum=os.environ["CHECKSUM"], recommended=True, mandatory=True, target=os.environ["TARGET"], changelog=os.environ["CHANGELOG"]); open("payload.json", "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False))'
            else
              upload_response="$(curl --fail-with-body --show-error --silent \
                -X POST \
                -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
                -F "file=@${artifact_path}" \
                "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/upload")"

              export UPLOAD_RESPONSE="$upload_response"
              python -c 'import json, os; upload = json.loads(os.environ["UPLOAD_RESPONSE"])["data"]; payload = dict(productCode=os.environ["PRODUCT_CODE"], channelCode=os.environ["CHANNEL"], versionName=os.environ["VERSION_NAME"], commitHash=os.environ["COMMIT_HASH"], artifactSourceType="UPLOADED_FILE", downloadUrl=upload["url"], fileBucket=upload.get("bucket") or "", fileKey=upload.get("key") or "", fileSize=int(os.environ["FILE_SIZE"]), checksum=os.environ["CHECKSUM"], recommended=True, mandatory=True, target=os.environ["TARGET"], changelog=os.environ["CHANGELOG"]); open("payload.json", "w", encoding="utf-8").write(json.dumps(payload, ensure_ascii=False))'
            fi

            curl --fail-with-body --show-error --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              --data @payload.json \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
          done
