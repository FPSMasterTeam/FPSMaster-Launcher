[package]
name = "fpsmaster-launcher"
version = "0.3.17"
edition = "2021"
license = "MIT"
repository = "https://github.com/FPSMasterTeam/FPSMaster-Launcher"
authors = ["FPSMaster Team"]
[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.22"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
# rustls-tls (= webpki-roots) 单独用会只信任编译进二进制的 Mozilla 根列表，完全
# 不读 Windows 系统证书存储。装了 HTTPS 扫描类杀软(360/火绒/卡巴)或走企业代理
# (Zscaler/深信服)的用户，其自签根只在系统存储里 → 浏览器能开官网，启动器握手
# 直接失败。两个 feature 同时开，reqwest 会把 webpki 和系统根合并进同一个
# RootCertStore，系统存储读不出来时仍有 webpki 兜底。
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tar = "0.4"
tauri = { version = "2.10", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# static: 强制编译内置 liblzma。否则 lzma-sys 的 build.rs 会 pkg-config 探测到
# 构建机上 Homebrew 的 xz，把 /opt/homebrew/opt/xz/lib/liblzma.5.dylib 这个绝对
# 路径写死进 Mach-O，用户机器上没有该文件 → dyld 启动即 SIGABRT。
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell"
] }

[features]
default = []

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata]
tauri = {}

[package.metadata.tauri-winres]
OriginalFilename = "fpsmaster-launcher.exe"
ProductName = "FPSMaster Launcher"
