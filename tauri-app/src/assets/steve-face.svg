<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- Default avatar: the classic Steve face as an 8x8 pixel grid, used whenever
       no profile skin can be resolved so the avatar slot is never empty. -->
  <rect x="0" y="0" width="8" height="8" fill="#b6896c"/>
  <rect x="0" y="0" width="8" height="2" fill="#2b1b0d"/>
  <rect x="1" y="1" width="6" height="1" fill="#332210"/>
  <rect x="0" y="2" width="1" height="1" fill="#2b1b0d"/>
  <rect x="7" y="2" width="1" height="1" fill="#2b1b0d"/>
  <rect x="1" y="2" width="1" height="1" fill="#aa7d66"/>
  <rect x="6" y="2" width="1" height="1" fill="#aa7d66"/>
  <rect x="0" y="3" width="1" height="1" fill="#aa7d66"/>
  <rect x="7" y="3" width="1" height="1" fill="#aa7d66"/>
  <rect x="3" y="3" width="2" height="1" fill="#c49578"/>
  <rect x="1" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="6" y="4" width="1" height="1" fill="#ffffff"/>
  <rect x="2" y="4" width="1" height="1" fill="#4a3d8c"/>
  <rect x="5" y="4" width="1" height="1" fill="#4a3d8c"/>
  <rect x="2" y="5" width="1" height="1" fill="#aa7d66"/>
  <rect x="5" y="5" width="1" height="1" fill="#aa7d66"/>
  <rect x="3" y="5" width="2" height="1" fill="#8a5a40"/>
  <rect x="2" y="6" width="1" height="1" fill="#7a4a33"/>
  <rect x="5" y="6" width="1" height="1" fill="#7a4a33"/>
  <rect x="3" y="6" width="2" height="1" fill="#4f2d1f"/>
  <rect x="3" y="7" width="2" height="1" fill="#7a4a33"/>
</svg>
